name: Release (reusable)

# Verifies, tests and packs a release. Projects call it from their own release workflow,
# which a tag pushed by `vrt release` starts, and publish the uploaded "release" artifact
# in a job of their own with `vrt release-publish`. npm's trusted publishing checks the
# file name of the calling workflow, so publishing stays in the caller.
#
# It never changes the repository. Re-running it is safe.
# Setup: https://github.com/versatiles-org/node-release-tool#release-workflow

on:
   workflow_call:
      inputs:
         node-version:
            description: Node.js version to build and test with.
            type: string
            default: '24'
         check-script:
            description: npm script that lints, typechecks, builds and tests.
            type: string
            default: check
         vrt:
            description: Command that runs vrt, from the project's devDependencies by default.
            type: string
            default: npx vrt
      outputs:
         version:
            description: The released version, without "v".
            value: ${{ jobs.build.outputs.version }}
         prerelease:
            description: Whether the version is a prerelease ("true" or "false").
            value: ${{ jobs.build.outputs.prerelease }}
         dist-tag:
            description: The npm dist-tag to publish with ("next" for prereleases, else "latest").
            value: ${{ jobs.build.outputs.dist-tag }}
         tool-version:
            description: The version of @versatiles/release-tool that checked and packed the release.
            value: ${{ jobs.build.outputs.tool-version }}

permissions: {}

env:
   FORCE_COLOR: 1

jobs:
   build:
      name: Verify, test and pack
      runs-on: ubuntu-latest
      permissions:
         contents: read
      outputs:
         version: ${{ steps.check.outputs.version }}
         prerelease: ${{ steps.check.outputs.prerelease }}
         dist-tag: ${{ steps.check.outputs.dist-tag }}
         tool-version: ${{ steps.check.outputs.tool-version }}
      steps:
         - name: Checkout
           uses: actions/checkout@v7
           with:
              fetch-depth: 0

         # A tag can be pushed from any commit. Only commits on main are released, so a
         # release always matches the reviewed, CI-tested history.
         - name: Check that the tagged commit is on main
           run: |
              git fetch --quiet origin main
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                 echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Refusing to release it."
                 exit 1
              fi

         - name: Setup Node
           uses: actions/setup-node@v7
           with:
              node-version: ${{ inputs.node-version }}
              cache: npm

         - name: Install dependencies
           run: npm ci

         - name: Check tag, versions and release notes
           id: check
           run: ${{ inputs.vrt }} release-check "$GITHUB_REF_NAME" --notes release/notes.md

         - name: Lint, typecheck, build and test
           run: npm run "${{ inputs.check-script }}"

         - name: Pack
           run: ${{ inputs.vrt }} release-pack release

         - name: Upload release files
           uses: actions/upload-artifact@v7
           with:
              name: release
              path: release/
              if-no-files-found: error
              retention-days: 30
